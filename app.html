    const u = _izinCache.find(x => x.id === uid);
    if (u) u[kolom] = nilai;
    setMsg("Tersimpan. Berlaku setelah pengguna masuk ulang.", true);
  } catch (e) { setMsg("Gagal: " + e.message, false); }
};

let _pgJurnal = 1;
const PG_JURNAL = 5;

async function renderDaftarJurnal(){
  try {
    const fStatus = $("fStatus") ? $("fStatus").value : "";
    const fKelas = $("fKelas") ? $("fKelas").value : "";
    const fDari = $("fDari") ? $("fDari").value : "";
    const fSampai = $("fSampai") ? $("fSampai").value : "";

    const periode = await ambilPeriodeAktif();
    let q = sb.from("jurnal").select("*");
    if (periode.tahun_ajaran) {
      q = q.eq("tahun_ajaran", periode.tahun_ajaran).eq("semester", periode.semester);
    }
    if (fStatus) q = q.eq("status", fStatus);
    if (fKelas) q = q.eq("kelas_id", fKelas);
    if (fDari) q = q.gte("tanggal", fDari);
    if (fSampai) q = q.lte("tanggal", fSampai);
    q = q.order("dibuat", { ascending: false });

    const { data, error } = await q;
    if (error) throw new Error(error.message);
    _jurnalCache = data || [];
    _pgJurnal = 1;   // reset ke halaman 1 tiap query/filter baru
    gambarHalamanJurnal();
  } catch (e) {
    $("jurnalList").innerHTML = '<div class="empty">Gagal memuat: ' + esc(e.message) + '</div>';
  }
}

function gambarHalamanJurnal(){
  if (!_jurnalCache.length) {
    $("jurnalList").innerHTML = '<div class="empty">Tidak ada jurnal yang cocok.</div>'; return;
  }
  const bisaVerif = (ME.role === "admin" || ME.role === "kepsek");
  const bisaHapus = (ME.role === "admin");
  const bisaEdit = (ME.role === "admin" || ME.role === "guru");
  const warna = { Menunggu:"#b78100", Disetujui:"#2b8a3e", Ditolak:"#c92a2a" };

  const totalHal = Math.ceil(_jurnalCache.length / PG_JURNAL);
  if (_pgJurnal > totalHal) _pgJurnal = totalHal;
  if (_pgJurnal < 1) _pgJurnal = 1;
  const mulai = (_pgJurnal - 1) * PG_JURNAL;
  const potongan = _jurnalCache.slice(mulai, mulai + PG_JURNAL);

  let html = "";
  potongan.forEach(j => {
    const w = warna[j.status] || "#6b7280";
    html += '<div class="card" style="margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
        '<div><b>' + esc(j.mapel_nama||"-") + '</b> — ' + esc(j.kelas_nama||"-") +
          '<div style="font-size:13px;color:#6b7280">' + esc(j.guru_nama||"-") + ' · ' +
          esc(j.tanggal||"-") + ' · Jam ' + esc(j.jam_ke||"-") + '</div></div>' +
          (j.guru_asli ? '<div style="font-size:12px;color:#b78100">Menggantikan: ' +
          esc(j.guru_asli) + '</div>' : '') +
        '<span style="padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:' +
          w + '22;color:' + w + '">' + esc(j.status) + '</span>' +
      '</div>' +
      '<div style="margin-top:6px"><b>Materi:</b> ' + esc(j.materi||"-") + '</div>' +
      '<div style="font-size:13px;color:#6b7280;margin-top:4px">Kehadiran: ' + esc(j.kehadiran||"") + '</div>' +
      (j.verifikasi_oleh ? '<div style="font-size:12px;color:#6b7280;margin-top:4px">Diverifikasi: ' +
        esc(j.verifikasi_oleh) + '</div>' : '') +
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-ghost btn-sm" onclick="cetakJurnal(\'' + j.id + '\')">🖨 Cetak</button>' +
        (j.ada_foto ? '<button class="btn btn-ghost btn-sm" onclick="lihatFoto(\'' + j.id + '\')">📷 Foto</button>' : '') +
        (bisaEdit ? '<button class="btn btn-ghost btn-sm" onclick="editJurnal(\'' + j.id + '\')">✎ Edit</button>' : '') +
        (bisaVerif ? '<button class="btn btn-sm" style="background:#2b8a3e" onclick="verif(\'' + j.id + '\',\'Disetujui\')">✓ Setujui</button>' +
          '<button class="btn btn-sm" style="background:#c92a2a" onclick="verif(\'' + j.id + '\',\'Ditolak\')">✕ Tolak</button>' : '') +
        (bisaHapus ? '<button class="btn btn-sm" style="background:#c92a2a" onclick="hapusJurnal(\'' + j.id + '\')">🗑 Hapus</button>' : '') +
      '</div>' +
    '</div>';
  });
  html += kontrolHalaman(_pgJurnal, totalHal, "gantiHalamanJurnal");
  $("jurnalList").innerHTML = html;
}

window.gantiHalamanJurnal = (arah) => { _pgJurnal += arah; gambarHalamanJurnal(); };

  gantiGuruAsli();
  if ($("jMapel")) $("jMapel").value = j.mapel_id || "";
  $("jMateri").value = j.materi || "";
  $("jCatatan").value = j.catatan || "";

  // muat absensi kelas, lalu terapkan status tersimpan
  await muatAbsensi();
  const { data: absenLama } = await sb.from("absensi")
    .select("siswa_id, status").eq("jurnal_id", id);
  if (absenLama && absenLama.length) {
    absenLama.forEach(a => {
      const idx = _absenSiswa.findIndex(s => s.siswa_id === a.siswa_id);

  // foto: tampilkan info foto lama (tak wajib ganti saat edit)
  if (_fotoLamaAda) {

      '<p style="color:#6b7280;font-size:13px;margin-top:8px">Foto lama tersimpan. ' +
      'Pilih file baru hanya bila ingin mengganti.</p>';
  }

  // ubah tampilan jadi mode edit
  if ($("jJudulForm")) $("jJudulForm").textContent = "Edit Jurnal";
  $("jBtnSimpan").textContent = "Perbarui Jurnal";
  window.scrollTo({ top: 0, behavior: "smooth" });
};

let _pgHalaman = 1;
const PG_PER_HAL = 10;

async function renderPengguna(){
  try {
    const { data: profilData, error: errP } = await sb.from("profil")
      .select("*, guru_mapel(mapel:mapel_id(nama_mapel))");
    if (errP) throw new Error(errP.message);
    _penggunaCache = profilData || [];
    _penggunaCache.sort((a,b) => String(a.nama||"").localeCompare(String(b.nama||"")));
    gambarHalamanPengguna();
  } catch (e) {
    $("penggunaList").innerHTML = '<div class="empty">Gagal memuat: ' + esc(e.message) + '</div>';
  }
}

function gambarHalamanPengguna(){
  if (!_penggunaCache.length) {
    $("penggunaList").innerHTML = '<div class="empty">Belum ada pengguna.</div>'; return;
  }
  const totalHal = Math.ceil(_penggunaCache.length / PG_PER_HAL);
  if (_pgHalaman > totalHal) _pgHalaman = totalHal;
  if (_pgHalaman < 1) _pgHalaman = 1;
  const mulai = (_pgHalaman - 1) * PG_PER_HAL;
  const potongan = _penggunaCache.slice(mulai, mulai + PG_PER_HAL);

  let html = '<table><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Mapel</th><th>NIP</th>' +
    '<th class="aksi-cell">Aksi</th></tr>';
  potongan.forEach(u => {
    const iniSaya = (u.id === ME.id);
    const nmAman = esc(u.nama || u.email).replace(/'/g,"");
    const mapelTeks = (u.guru_mapel||[]).map(g => g.mapel?.nama_mapel).filter(Boolean).join(", ") || "-";
    html += '<tr><td><b>' + esc(u.nama || "-") + '</b>' +
        (iniSaya ? ' <span style="color:#3b5bdb;font-size:11px">(Anda)</span>' : '') + '</td>' +
      '<td>' + esc(u.email || "-") + '</td>' +
      '<td><span class="badge" style="background:#fff9db;color:#b78100">' + namaRole(u.role) + '</span></td>' +
      '<td style="font-size:12px">' + esc(mapelTeks) + '</td>' +
      '<td>' + esc(u.nip || "-") + '</td>' +
      '<td class="aksi-cell">' +
        '<button class="aksi-edit" onclick="editPengguna(\'' + u.id + '\')">Edit</button>' +
        (iniSaya ? '' :
          '<button class="aksi-hapus" onclick="hapusPengguna(\'' + u.id + '\',\'' + nmAman + '\')">Hapus</button>') +
      '</td></tr>';
  });
  html += '</table>';

  // kontrol halaman
  if (totalHal > 1) {
    html += '<div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px">' +
      '<button class="btn btn-ghost btn-sm" ' + (_pgHalaman<=1?'disabled ':'') +
        'onclick="gantiHalamanPengguna(-1)">‹ Sebelumnya</button>' +
      '<span style="font-size:13px;color:#6b7280">Halaman ' + _pgHalaman + ' / ' + totalHal + '</span>' +
      '<button class="btn btn-ghost btn-sm" ' + (_pgHalaman>=totalHal?'disabled ':'') +
        'onclick="gantiHalamanPengguna(1)">Berikutnya ›</button>' +
    '</div>';
  }
  $("penggunaList").innerHTML = html;
}

window.gantiHalamanPengguna = (arah) => {
  _pgHalaman += arah;
  gambarHalamanPengguna();
};

window.buatPengguna = async () => {
  const nama = $("uNama").value.trim();
  const email = $("uEmail").value.trim();
  const pass = $("uPass").value;
  const role = $("uRole").value;
  const nip = $("uNip").value.trim();
  const setMsg = (t, ok) => { $("uMsg").innerHTML =
    '<div style="padding:10px;border-radius:8px;font-size:13px;margin-top:12px;' +
    (ok?'background:#ebfbee;color:#2b8a3e':'background:#fff0f0;color:#c92a2a') + '">' + esc(t) + '</div>'; };

  if (!nama || !email || pass.length < 6) {
    return setMsg("Lengkapi nama, email, dan kata sandi minimal 6 karakter.", false);
  }

  const btn = $("uBtnSimpan");
  btn.disabled = true; btn.textContent = "Membuat akun...";
  try {
    const hasil = await panggilFungsi("buat-pengguna", { nama, email, pass, role, nip });

    // simpan mapel diampu (bila guru) — pakai id dari akun yang baru dibuat
    if (role === "guru" && hasil.id) {
      const mapelIds = Array.from(document.querySelectorAll(".uMapelCek:checked"))
        .map(cb => ({ guru_id: hasil.id, mapel_id: cb.value }));
      if (mapelIds.length) {
        const { error: errMapel } = await sb.from("guru_mapel").insert(mapelIds);
        if (errMapel) { /* akun sudah jadi; beri tahu tapi jangan gagal total */
          setMsg('Akun dibuat, tapi mapel gagal disimpan: ' + errMapel.message, false);
          await renderPengguna(); return;
        }
      }
    }

    setMsg('Akun "' + hasil.nama + '" dibuat sebagai ' + namaRole(hasil.role) + '.', true);
    $("uNama").value = ""; $("uEmail").value = ""; $("uPass").value = ""; $("uNip").value = "";
    await renderPengguna();
  } catch (e) {
    setMsg("Gagal: " + e.message, false);
  } finally {
    btn.disabled = false; btn.textContent = "Buat Akun";
  }
};

window.editPengguna = (id) => {
  const u = _penggunaCache.find(x => x.id === id);
  if (!u) return;
  _editUserId = id;
  $("uNama").value = u.nama || "";
  $("uEmail").value = u.email || "";
  $("uPass").value = "";
  $("uRole").value = u.role || "guru";
  $("uNip").value = u.nip || "";

// tampilkan blok mapel & centang mapel yang sudah diampu
  ubahPeranPengguna();
  if (u.role === "guru") {
    sb.from("guru_mapel").select("mapel_id").eq("guru_id", id).then(({ data }) => {
      const ids = (data||[]).map(x => x.mapel_id);
      document.querySelectorAll(".uMapelCek").forEach(cb => {
        cb.checked = ids.includes(cb.value);
      });
    });
  }

  // kunci email & password saat edit (tak bisa diubah dari sini)
  $("uEmail").disabled = true;
  $("uPass").disabled = true;
  $("uPass").placeholder = "— (tak dapat diubah di sini)";

  // ubah tampilan form jadi mode edit
  document.querySelector("#main .card h2").textContent = "Edit Pengguna";
  $("uBtnSimpan").textContent = "Perbarui Data";
  $("uBtnSimpan").setAttribute("onclick", "simpanEditPengguna()");
  if ($("uBtnBatal")) $("uBtnBatal").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
  $("uNama").focus();
};

window.simpanEditPengguna = async () => {
  const nama = $("uNama").value.trim();
  const role = $("uRole").value;
  const nip = $("uNip").value.trim();
  const setMsg = (t, ok) => { $("uMsg").innerHTML =
    '<div style="padding:10px;border-radius:8px;font-size:13px;margin-top:12px;' +
    (ok?'background:#ebfbee;color:#2b8a3e':'background:#fff0f0;color:#c92a2a') + '">' + esc(t) + '</div>'; };
  if (!nama) return setMsg("Nama tidak boleh kosong.", false);

  const btn = $("uBtnSimpan");
  btn.disabled = true; btn.textContent = "Menyimpan...";
  try {
    // update profil
    const { error } = await sb.from("profil")
      .update({ nama, role, nip }).eq("id", _editUserId);
    if (error) throw new Error(error.message);

    // perbarui mapel diampu (hanya bila guru): hapus lama, insert centangan baru
    if (role === "guru") {
      await sb.from("guru_mapel").delete().eq("guru_id", _editUserId);
      const mapelIds = Array.from(document.querySelectorAll(".uMapelCek:checked"))
        .map(cb => ({ guru_id: _editUserId, mapel_id: cb.value }));
      if (mapelIds.length) {
        const { error: errM } = await sb.from("guru_mapel").insert(mapelIds);
        if (errM) throw new Error("Profil tersimpan, mapel gagal: " + errM.message);
      }
    } else {
      // bukan guru lagi → bersihkan mapel
      await sb.from("guru_mapel").delete().eq("guru_id", _editUserId);
    }

    setMsg('Data "' + nama + '" diperbarui.', true);
    batalEditPengguna();
    await renderPengguna();
  } catch (e) {
    setMsg("Gagal memperbarui: " + e.message, false);
  } finally {
    btn.disabled = false;
  }
};

window.batalEditPengguna = () => {
  _editUserId = null;
  $("uNama").value = ""; $("uEmail").value = ""; $("uPass").value = ""; $("uNip").value = "";
  $("uEmail").disabled = false;
  $("uPass").disabled = false;
  $("uPass").placeholder = "Kata sandi awal";
  document.querySelector("#main .card h2").textContent = "Tambah Pengguna";
  $("uBtnSimpan").textContent = "Buat Akun";
  $("uBtnSimpan").setAttribute("onclick", "buatPengguna()");
  if ($("uBtnBatal")) $("uBtnBatal").style.display = "none";
};

window.hapusPengguna = async (id, nama) => {
  if (id === ME.id) return toast("Tidak bisa menghapus akun sendiri.");
  if (!(await konfirmasi('Hapus Pengguna',
    'Hapus data pengguna "' + nama + '"?\n\nIni menghapus peran pengguna sehingga ia tak bisa masuk lagi. ' +
    'Akun login-nya di sistem Auth perlu dihapus terpisah lewat dashboard.', {bahaya:true}))) return;
  try {
    const { error } = await sb.from("profil").delete().eq("id", id);

    toast("Data pengguna dihapus.");

};

/* ---- Import massal pengguna ---- */
window.importPengguna = async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const setMsg = (t, ok) => { $("uImportMsg").innerHTML =
    '<div style="padding:10px;border-radius:8px;font-size:13px;' +
    (ok?'background:#ebfbee;color:#2b8a3e':'background:#fff0f0;color:#c92a2a') + '">' + esc(t) + '</div>'; };
  $("uImportHasil").innerHTML = "";
  setMsg("Membaca file...", true);

  let rows;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
  } catch (e) {
    setMsg("Gagal membaca file: " + e.message, false); ev.target.value=""; return;
  }
  if (!rows.length) { setMsg("File kosong atau format tak dikenali.", false); ev.target.value=""; return; }

  const akun = rows.map(r => {
    let role = String(r["Peran (guru/kepsek/admin)"] ?? r["Peran"] ?? "guru").trim().toLowerCase();
    if (!["guru","kepsek","admin"].includes(role)) role = "guru";
    return {
      nama: String(r["Nama"] ?? "").trim(),
      email: String(r["Email"] ?? "").trim(),
      pass: String(r["Kata Sandi"] ?? r["Password"] ?? "").trim(),
      role,
      nip: String(r["NIP"] ?? "").trim()
    };
  });

  setMsg("Memproses " + akun.length + " akun... (jangan tutup halaman)", true);

  try {
    const hasil = await panggilFungsi("buat-pengguna", { akun });
    setMsg("Selesai. Berhasil: " + hasil.sukses + ", gagal: " + hasil.gagal +
      " dari " + hasil.total + " baris.", hasil.gagal === 0);

    let tabel = '<table style="margin-top:12px"><tr><th>Email</th><th>Status</th><th>Keterangan</th></tr>';
    hasil.detail.forEach(d => {
      tabel += '<tr><td>' + esc(d.email) + '</td>' +
        '<td>' + (d.ok ? '<span style="color:#2b8a3e">OK</span>'
                       : '<span style="color:#c92a2a">Gagal</span>') + '</td>' +
        '<td>' + esc(d.ok ? namaRole(d.role) : d.ket) + '</td></tr>';
    });
    tabel += '</table>';
    $("uImportHasil").innerHTML = tabel;

    await renderPengguna();
  } catch (e) {
    setMsg("Gagal mengimpor: " + e.message, false);
  }
  ev.target.value = "";
};

        '</div>' +
        '<button class="btn" id="jdBtnSimpan" onclick="simpanJadwal()">Simpan Slot</button>' +
        '<button class="btn btn-ghost btn-sm" id="jdBtnBatal" style="margin-left:8px;display:none" ' +
          'onclick="batalEditJadwal()">Batal Edit</button>' +
        '<div id="jdMsg"></div>' +
      '</div>' : '') +
    '<div id="jdTabel"><div class="page-kosong">Memuat jadwal...</div></div>';

  await renderJadwal();
}

window.gantiKelasJadwal = () => {
  _jdKelasAktif = $("jdKelas").value;
  batalEditJadwal();
  renderJadwal();
};

// Ambil jadwal kelas aktif + nama mapel & guru via relasi (dua join sekaligus)
async function renderJadwal(){
  $("jdTabel").innerHTML = '<div class="card"><div class="page-kosong">Memuat...</div></div>';
  try {
    const { data, error } = await sb
      .from("jadwal")
      .select("id, hari, jam_ke, waktu, kelas_id, mapel_id, guru_id, " +
              "mapel:mapel_id(nama_mapel), guru:guru_id(nama, email)")
      .eq("kelas_id", _jdKelasAktif);
    if (error) throw new Error(error.message);
    _jadwalCache = data || [];
    gambarTabelJadwal();
  } catch (e) {
    $("jdTabel").innerHTML = '<div class="card"><div class="page-kosong">Gagal memuat: ' +
      esc(e.message) + '</div></div>';
  }
}

function gambarTabelJadwal(){
  const bolehEdit = (ME.role === "admin");
  const namaKelas = (_jdKelasList.find(k => k.id === _jdKelasAktif)||{}).nama_kelas || "-";

  if (!_jadwalCache.length) {
    $("jdTabel").innerHTML = '<div class="card"><h2>Jadwal — ' + esc(namaKelas) + '</h2>' +
      '<div class="empty">Belum ada jadwal untuk kelas ini.</div></div>';
    return;
  }

  // Kelompokkan per hari, lalu urutkan tiap hari berdasar jam
  const perHari = {};
  _jadwalCache.forEach(j => {
    const h = Number(j.hari) || 0;
    (perHari[h] = perHari[h] || []).push(j);
  });
  Object.values(perHari).forEach(arr =>
    arr.sort((a,b) => String(a.jam_ke).localeCompare(String(b.jam_ke), undefined, { numeric: true })));

  let html = '<div class="card"><h2>Jadwal — ' + esc(namaKelas) + '</h2>';
  for (let h = 1; h <= 5; h++) {
    const slot = perHari[h];
    if (!slot || !slot.length) continue;
    html += '<h3 style="margin:14px 0 6px;color:#3b5bdb">' + HARI[h] + '</h3>' +
      '<table><tr><th>Jam</th><th>Waktu</th><th>Mapel</th><th>Guru</th>' +
      (bolehEdit ? '<th class="aksi-cell">Aksi</th>' : '') + '</tr>';
    slot.forEach(j => {
      const namaMapel = (j.mapel && j.mapel.nama_mapel) ? j.mapel.nama_mapel : "-";
      const namaGuru = (j.guru && (j.guru.nama || j.guru.email)) ? (j.guru.nama || j.guru.email) : "-";
      html += '<tr><td><b>' + esc(j.jam_ke||"-") + '</b></td>' +
        '<td>' + esc(j.waktu||"-") + '</td>' +
        '<td>' + esc(namaMapel) + '</td>' +
        '<td>' + esc(namaGuru) + '</td>' +
        (bolehEdit ? '<td class="aksi-cell">' +
          '<button class="aksi-edit" onclick="editJadwal(\'' + j.id + '\')">Edit</button>' +
          '<button class="aksi-hapus" onclick="hapusJadwal(\'' + j.id + '\')">Hapus</button>' +
          '</td>' : '') + '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  $("jdTabel").innerHTML = html;
}

window.simpanJadwal = async () => {
  const setMsg = (t, ok) => { $("jdMsg").innerHTML =
    '<div style="padding:10px;border-radius:8px;font-size:13px;margin-top:10px;' +
    (ok?'background:#ebfbee;color:#2b8a3e':'background:#fff0f0;color:#c92a2a') + '">' + esc(t) + '</div>'; };
  const hari = Number($("jdHari").value);
  const jam_ke = $("jdJam").value.trim();
  const waktu = $("jdWaktu").value.trim();
  const mapel_id = $("jdMapel").value || null;
  const guru_id = $("jdGuru").value || null;
  if (!jam_ke) return setMsg("Jam ke belum diisi.", false);
  if (!mapel_id) return setMsg("Pilih mapel dulu.", false);
  if (!guru_id) return setMsg("Pilih guru dulu.", false);
  try {
    if (_editJadwalId) {
      const { error } = await sb.from("jadwal")
        .update({ hari, jam_ke, waktu, mapel_id, guru_id }).eq("id", _editJadwalId);
      if (error) throw new Error(error.message);
      setMsg("Slot diperbarui.", true); batalEditJadwal();
    } else {
      const { error } = await sb.from("jadwal")
        .insert({ kelas_id: _jdKelasAktif, hari, jam_ke, waktu, mapel_id, guru_id });
      if (error) throw new Error(error.message);
      $("jdJam").value = ""; $("jdWaktu").value = "";
      setMsg("Slot ditambahkan.", true);
    }
    await renderJadwal();
  } catch (e) { setMsg("Gagal menyimpan: " + e.message, false); }
};

window.editJadwal = (id) => {
  const j = _jadwalCache.find(x => x.id === id);
  if (!j) return;
  _editJadwalId = id;
  $("jdHari").value = j.hari || 1;
  $("jdJam").value = j.jam_ke || "";
  $("jdWaktu").value = j.waktu || "";
  $("jdMapel").value = j.mapel_id || "";
  $("jdGuru").value = j.guru_id || "";
  $("jdJudulForm").textContent = "Edit Slot Jadwal";
  $("jdBtnSimpan").textContent = "Perbarui Slot";
  $("jdBtnBatal").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.batalEditJadwal = () => {
  _editJadwalId = null;
  if ($("jdJam")) $("jdJam").value = "";
  if ($("jdWaktu")) $("jdWaktu").value = "";
  if ($("jdJudulForm")) $("jdJudulForm").textContent = "Tambah Slot Jadwal";
  if ($("jdBtnSimpan")) $("jdBtnSimpan").textContent = "Simpan Slot";
  if ($("jdBtnBatal")) $("jdBtnBatal").style.display = "none";
};

window.hapusJadwal = async (id) => {
  if (!(await konfirmasi('Hapus Slot', 'Hapus slot jadwal ini?', {bahaya:true}))) return;
  try {
    const { error } = await sb.from("jadwal").delete().eq("id", id);
    if (error) throw new Error(error.message);
    toast("Slot dihapus."); await renderJadwal();
  } catch (e) { toast("Gagal menghapus: " + e.message); }
};
</script>
</body>
</html>
